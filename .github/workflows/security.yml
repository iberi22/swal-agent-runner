name: Security Scan (DAST)

on:
  schedule:
    # Run DAST scan weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'vite.config.ts'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'vite.config.ts'
      - 'package.json'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan (default: dev server on port 5173)'
        required: false
        default: 'http://localhost:5173'
      scan_type:
        description: 'Scan type — full or quick'
        required: false
        default: 'full'

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10
  # ZAP image: use the official zaproxy/zap-stable (owasp/zap2docker-stable was discontinued)
  ZAP_IMAGE: zaproxy/zap-stable

jobs:
  dast-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Start preview server
        run: |
          pnpm preview --host 0.0.0.0 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 >/dev/null 2>&1; then
              echo "✓ Preview server ready on http://localhost:4173"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "✗ Preview server failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Run OWASP ZAP DAST scan
        id: zap-scan
        run: |
          TARGET="http://localhost:4173"
          SCAN_TYPE="${{ inputs.scan_type || 'full' }}"
          REPORT_DIR="${{ github.workspace }}/test/security"
          mkdir -p "$REPORT_DIR"

          # Pull ZAP image
          docker pull "${ZAP_IMAGE}"

          echo "═══ OWASP ZAP DAST Scan ═══"
          echo "Target    : ${TARGET}"
          echo "Type      : ${SCAN_TYPE}"
          echo "Report    : ${REPORT_DIR}/zap-report.html"

          # Run ZAP with --network host to reach the preview server on localhost
          # (GitHub Actions runners are Linux, so host networking works directly)
          if [ "${SCAN_TYPE}" = "quick" ]; then
            SCAN_SCRIPT="zap-baseline.py"
          else
            SCAN_SCRIPT="zap-full-scan.py"
          fi

          docker run --rm \
            --network host \
            -v "${REPORT_DIR}:/zap/wrk:rw" \
            "${ZAP_IMAGE}" \
            "${SCAN_SCRIPT}" \
              -t "${TARGET}" \
              -r zap-report.html \
              -I

          echo "status=completed" >> "$GITHUB_OUTPUT"

      - name: Upload ZAP report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: test/security/zap-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Stop preview server
        if: always()
        run: |
          if [ -n "${PREVIEW_PID:-}" ]; then
            kill "${PREVIEW_PID}" 2>/dev/null || true
            echo "Preview server stopped (PID: ${PREVIEW_PID})"
          fi

      - name: Summarise scan results
        if: always()
        run: |
          REPORT="${GITHUB_WORKSPACE}/test/security/zap-report.html"
          if [ -f "$REPORT" ]; then
            echo "### 📋 OWASP ZAP DAST Scan Complete" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Workflow** | [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Target** | ${{ inputs.target_url || 'http://localhost:4173' }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Report** | Download from **Artifacts** → **zap-report** |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Scan Type** | ${{ inputs.scan_type || 'full' }} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠ OWASP ZAP DAST Scan — Report Not Found" >> "$GITHUB_STEP_SUMMARY"
          fi
