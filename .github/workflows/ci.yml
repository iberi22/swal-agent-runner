name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm run test

      - name: Configure WASM mock and Vite for build
        run: |
          mkdir -p src/wasm
          echo "export default async function init() {}; export class GestaltEngine {};" > src/wasm/gestalt_wasm.js
          node -e "
          const fs = require('fs');
          let config = fs.readFileSync('vite.config.ts', 'utf8');
          config = config.replace('export default defineConfig({', 'export default defineConfig({\n  worker: { format: \'es\' },');
          fs.writeFileSync('vite.config.ts', config);
          "

      - name: Build production bundle
        run: pnpm run build

      - name: Lint (if configured)
        run: |
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ] || [ -f eslint.config.cjs ] || [ -f .eslintrc.json ] || [ -f .eslintrc.js ] || [ -f .eslintrc.yml ] || [ -f .eslintrc ]; then
            pnpm run lint
          else
            echo "Linting not configured, skipping."
          fi
